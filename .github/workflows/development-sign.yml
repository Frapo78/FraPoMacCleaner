name: Apple Development signed macOS build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/development-sign.yml'

permissions:
  contents: read

jobs:
  signed-development-build:
    # Never load personal signing credentials on pull requests or arbitrary refs.
    if: github.ref == 'refs/heads/main' && github.repository == 'Frapo78/FraPoMacCleaner'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4

      - name: Validate environment and assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          bash scripts/check_brand_assets.sh
          xcodebuild -version

      - name: Build and test without signing credentials
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project FraPoMacCleaner.xcodeproj \
            -scheme FraPoMacCleaner -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/FraPoDevelopment" \
            CODE_SIGNING_ALLOWED=NO test
          test -f "$RUNNER_TEMP/FraPoDevelopment/Build/Products/Debug/FraPoMacCleaner.app/Contents/Resources/Assets.car"

      - name: Import Apple Development identity and sign build
        shell: bash
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPMENT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$P12_BASE64" || -z "$P12_PASSWORD" ]]; then
            echo 'Missing APPLE_DEVELOPMENT_P12_BASE64 or APPLE_DEVELOPMENT_P12_PASSWORD' >&2
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/frapo-development.keychain-db"
          P12="$RUNNER_TEMP/frapo-development.p12"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          umask 077
          printf '%s' "$P12_BASE64" | base64 -D > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 1800 "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Apple Development:/{print $2; exit}')"
          if [[ ! "$IDENTITY" =~ ^[0-9A-Fa-f]{40}$ ]]; then
            echo 'No valid Apple Development signing identity in imported keychain' >&2
            exit 1
          fi
          APP="$RUNNER_TEMP/FraPoDevelopment/Build/Products/Debug/FraPoMacCleaner.app"
          codesign --force --timestamp=none \
            --entitlements FraPoMacCleaner/Configuration/FraPoMacCleaner.entitlements \
            --sign "$IDENTITY" "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          # The expected team identifier is public metadata, not a signing secret.
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -qx 'TeamIdentifier=G76G8QYDFY'
          test "$(lipo -archs "$APP/Contents/MacOS/FraPoMacCleaner")" = arm64
          echo 'Apple Development signature verified (not Developer ID, not notarized).'

      - name: Package development ZIP and checksum
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/FraPoDevelopment/Build/Products/Debug/FraPoMacCleaner.app"
          ZIP="$RUNNER_TEMP/FraPoMacCleaner-AppleDevelopment-arm64.zip"
          ditto -c -k --keepParent "$APP" "$ZIP"
          cd "$RUNNER_TEMP"
          shasum -a 256 "$(basename "$ZIP")" > "$(basename "$ZIP").sha256"

      - name: Upload test-only signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: FraPoMacCleaner-AppleDevelopment-arm64
          path: |
            ${{ runner.temp }}/FraPoMacCleaner-AppleDevelopment-arm64.zip
            ${{ runner.temp }}/FraPoMacCleaner-AppleDevelopment-arm64.zip.sha256
          retention-days: 7
          if-no-files-found: error

      - name: Delete temporary signing identity
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/frapo-development.keychain-db" 2>/dev/null || true
          if [[ -f "$RUNNER_TEMP/frapo-development.p12" ]]; then
            rm -f "$RUNNER_TEMP/frapo-development.p12"
          fi
