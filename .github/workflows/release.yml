name: Release macOS ARM64 ZIP

on:
  push:
    branches: [main]
    paths: [RELEASE_VERSION]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version tag matching RELEASE_VERSION"
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag and build version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.version }}"
          else
            TAG="$(cat RELEASE_VERSION)"
          fi
          if [[ "${GITHUB_REF_TYPE}" != "tag" && "$TAG" != "$(cat RELEASE_VERSION)" ]]; then
            echo "The requested version differs from RELEASE_VERSION" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          else
            echo "Tag non valido: $TAG" >&2
            exit 1
          fi
          grep -q "MARKETING_VERSION = $VERSION;" FraPoMacCleaner.xcodeproj/project.pbxproj || {
            echo "MARKETING_VERSION non coincide con il tag" >&2
            exit 1
          }
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify original branding images
        run: bash scripts/check_brand_assets.sh
      - name: Build and test
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          xcodebuild -project FraPoMacCleaner.xcodeproj \
            -scheme FraPoMacCleaner -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/FraPoRelease" \
            CODE_SIGNING_ALLOWED=NO test
          xcodebuild -project FraPoMacCleaner.xcodeproj \
            -scheme FraPoMacCleaner -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/FraPoRelease" \
            CODE_SIGNING_ALLOWED=NO build
          APP="$RUNNER_TEMP/FraPoRelease/Build/Products/Release/FraPoMacCleaner.app"
          test -d "$APP"
          test "$(lipo -archs "$APP/Contents/MacOS/FraPoMacCleaner")" = "arm64"
      - name: Import Developer ID certificate
        if: steps.version.outputs.prerelease == 'false'
        env:
          CERT: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for value in "$CERT" "$PASSWORD" "$IDENTITY" "$APPLE_ID" "$APP_PASSWORD" "$TEAM_ID"; do
            if [[ -z "$value" ]]; then
              echo "Missing stable-release signing/notarization secret." >&2
              exit 1
            fi
          done
          KEYCHAIN="$RUNNER_TEMP/frop-release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$CERT" | base64 -D > "$RUNNER_TEMP/release-certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security import "$RUNNER_TEMP/release-certificate.p12" -k "$KEYCHAIN" -P "$PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"
      - name: Sign and notarize stable application
        if: steps.version.outputs.prerelease == 'false'
        env:
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/FraPoRelease/Build/Products/Release/FraPoMacCleaner.app"
          codesign --force --options runtime --timestamp \
            --entitlements "FraPoMacCleaner/Configuration/FraPoMacCleaner.entitlements" \
            --sign "$IDENTITY" "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/FraPoNotary.zip"
          xcrun notarytool submit "$RUNNER_TEMP/FraPoNotary.zip" \
            --apple-id "$APPLE_ID" --password "$APP_PASSWORD" \
            --team-id "$TEAM_ID" --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=2 "$APP"
      - name: Create ZIP and checksum
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/FraPoRelease/Build/Products/Release/FraPoMacCleaner.app"
          ZIP="FraPoMacCleaner-${{ steps.version.outputs.tag }}-macOS-arm64.zip"
          ditto -c -k --keepParent "$APP" "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          ZIP="FraPoMacCleaner-$TAG-macOS-arm64.zip"
          if [[ "$PRERELEASE" == "true" ]]; then
            gh release create "$TAG" "$ZIP" "$ZIP.sha256" \
              --target "$GITHUB_SHA" \
              --title "FraPoMacCleaner $TAG (test)" \
              --prerelease --generate-notes \
              --notes "Anteprima per test. Questa build non è firmata per la distribuzione e non è notarizzata. Non è una release stabile."
          else
            gh release create "$TAG" "$ZIP" "$ZIP.sha256" \
              --target "$GITHUB_SHA" \
              --title "FraPoMacCleaner $TAG" \
              --generate-notes
          fi
      - name: Remove temporary signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/frop-release.keychain-db" 2>/dev/null || true
